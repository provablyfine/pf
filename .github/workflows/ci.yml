name: CI

on:
  push:
    branches:
      - main
      - mathieu
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  mutation-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Install openssh-client
        run: sudo apt-get update && sudo apt-get install -y openssh-client
      - name: Mutation testing baseline
        run: scripts/check-mutation-baseline

  test:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman openssh-client socat jq
      - name: Run tests
        run: uv run pytest --basetemp=/tmp/pf-test-logs
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.python-version }}
          path: /tmp/pf-test-logs/

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Install podman and jq
        run: brew install podman jq
      - name: Start podman machine
        # Best-effort: GitHub-hosted macOS runners don't support the nested
        # virtualization podman machine needs (vfkit/Virtualization.framework
        # fails there), so this is expected to fail in hosted CI. When it
        # does, the podman/sshd-container-based e2e tests skip themselves via
        # conftest.py's _require_podman() rather than failing the job.
        continue-on-error: true
        run: |
          podman machine init
          podman machine start
          podman info
      - name: Run tests
        run: uv run pytest --basetemp=/tmp/pf-test-logs
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-macos
          path: /tmp/pf-test-logs/

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Build pf.exe
        run: |
          uv sync --group windows-build
          uv run --group windows-build pyinstaller packaging/windows/pf.spec
      - name: Smoke-test the packaged binary
        run: dist/pf/pf.exe --version
      - name: Enable OpenSSH Authentication Agent service
        run: |
          Set-Service ssh-agent -StartupType Manual
          Start-Service ssh-agent
      - name: Enable OpenSSH Server capability
        run: Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
      - name: Run native Windows smoke test
        # Currently xfail (strict=False) — see tests/test_windows_smoke.py's
        # module docstring for the open issue. Wired in now so it starts
        # reporting XPASS in this job once that's resolved.
        run: uv run pytest tests/test_windows_smoke.py -v

  docs:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy dev docs
        run: uv run mike deploy --push dev
