name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(uv version --short)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $PKG_VERSION"
            exit 1
          fi

  lint:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files

  test:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install podman
        run: sudo apt-get update && sudo apt-get install -y podman openssh-client socat jq
      - name: Run tests
        run: uv run pytest --basetemp=/tmp/pf-test-logs
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.python-version }}
          path: /tmp/pf-test-logs/

  audit:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Audit runtime dependencies
        # Fails the release if any runtime dependency has a known published
        # vulnerability. Renovate keeps the lockfile patched.
        run: uv audit --locked --no-dev --preview-features audit-command

  docs:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@v5
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Deploy docs
        run: |
          VERSION=$(uv version --short)
          uv run mike deploy --push --update-aliases "$VERSION" latest

  build-client:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build provablyfine-client wheel
        run: uv build --package provablyfine-client
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-client
          path: dist/

  build-sdist:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build provablyfine sdist
        run: uv build --package provablyfine --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist-provablyfine
          path: dist/*.tar.gz

  build-wheels:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build provablyfine wheel
        run: uv build --package provablyfine --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-provablyfine
          path: dist/*.whl

  build-windows:
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build pf.exe
        run: |
          uv sync --group build
          uv run --group build pyinstaller packaging/windows/pf.spec
      - name: Build installer
        run: |
          # ISCC mis-parses LF-only scripts (silently drops directives like
          # AppVersion), and checkout-side eol conversion is not reliable
          # across git builds — normalize explicitly.
          $p = 'packaging\windows\pf.iss'
          $t = [IO.File]::ReadAllText($p) -replace "`r`n", "`n"
          [IO.File]::WriteAllText($p, ($t -replace "`n", "`r`n"))
          $version = uv version --short
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\windows\pf.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/pf-setup.exe

  build-linux:
    needs: [lint, test, audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    container:
      # Build in the oldest supported environment: glibc 2.34 floor, so the
      # payload runs on Ubuntu 22.04+, Debian 12+, RHEL 9+, and current Fedora.
      image: rockylinux:9
    env:
      UV_LINK_MODE: copy
    steps:
      - name: Install build prerequisites
        # curl is preinstalled on rockylinux:9 as curl-minimal; installing the
        # full curl package would conflict with it.
        run: dnf install -y --setopt=install_weak_deps=False git tar gzip
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
      - name: Build PyInstaller payload
        run: |
          uv sync --no-dev --group build --frozen
          uv run --no-sync --group build pyinstaller packaging/linux/pf.spec --noconfirm
      - name: Build deb and rpm packages
        run: |
          case "${{ runner.arch }}" in
            X64)   nfpm_arch=x86_64 ;;
            ARM64) nfpm_arch=arm64  ;;
            *) echo "unexpected runner.arch ${{ runner.arch }}"; exit 1 ;;
          esac
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v2.43.0/nfpm_2.43.0_Linux_${nfpm_arch}.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          export PF_VERSION="$(uv version --short)"
          export PF_ARCH="${{ matrix.arch }}"
          /tmp/nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/
          /tmp/nfpm package -f packaging/linux/nfpm.yaml -p rpm -t dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ matrix.arch }}
          path: dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-${{ matrix.arch }}
          path: dist/*.rpm

  smoke-test-linux:
    needs: [build-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64 deb
          - os: ubuntu-latest
            artifact: linux-deb-amd64
            distro: debian:12
          - os: ubuntu-latest
            artifact: linux-deb-amd64
            distro: ubuntu:22.04
          - os: ubuntu-latest
            artifact: linux-deb-amd64
            distro: ubuntu:24.04
          # amd64 rpm
          - os: ubuntu-latest
            artifact: linux-rpm-x86_64
            distro: rockylinux:9
          - os: ubuntu-latest
            artifact: linux-rpm-x86_64
            distro: fedora:latest
          # arm64
          - os: ubuntu-24.04-arm
            artifact: linux-deb-arm64
            distro: debian:12
          - os: ubuntu-24.04-arm
            artifact: linux-rpm-aarch64
            distro: rockylinux:9
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: pkg
      - name: Install and smoke-test in ${{ matrix.distro }}
        run: |
          docker run --rm \
            -v "$PWD/pkg:/pkg:ro" \
            -v "$PWD/packaging/linux/smoke.sh:/smoke.sh:ro" \
            ${{ matrix.distro }} /smoke.sh

  publish-pypi:
    needs: [build-client, build-sdist, build-wheels, docs, audit]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '{wheel-*,sdist-*}'
          merge-multiple: true
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [publish-pypi, build-windows, smoke-test-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '{wheel-*,sdist-*,windows-installer,linux-deb-*,linux-rpm-*}'
          merge-multiple: true
          path: dist/
      - name: Generate checksums
        run: cd dist && sha256sum --binary * > SHA256SUMS
      - name: Extract release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## $VERSION/{found=1; next} found && /^## /{exit} found" CHANGELOG.md)
          printf 'body<<!EOF!\n%s\n!EOF!\n' "$NOTES" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: ${{ steps.notes.outputs.body }}
