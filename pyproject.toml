[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "provablyfine"
authors = [
  {name = "Mathieu Lacage", email = "mathieu.lacage@cutebugs.net"},
]
maintainers = [
  {name = "Mathieu Lacage", email = "mathieu.lacage@cutebugs.net"},
]
description = "Centralized Access-Control for SSH"
readme = "README.md"
version = "0.7.3"
license = "AGPL-3.0-only"
license-files = ["LICENSE.md"]
keywords = ["SSH", "access-control", "bastion"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: Pydantic",
  "Framework :: Pytest",
  "Framework :: tox",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: GNU Affero General Public License v3",
  "Natural Language :: English",
  "Topic :: Software Development :: Build Tools",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45.0.0",
  "sqlalchemy",
  "http-sfv",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "tabulate>=0.9.0",
  "requests>=2.32.5",
  "pydantic",
  "textual",
  "textual-autocomplete>=4.0.6",
  "pyjwt>=2.12.1",
  "PyYAML>=6.0",
  "prometheus_client>=0.20.0",
  "provablyfine-client",
  "alembic>=1.18.4",
]

[project.optional-dependencies]
bcrypt = ["bcrypt"]

[project.urls]
Documentation = "https://docs.provablyfine.net"
Repository = "https://github.com/provablyfine/pf.git"
Issues = "https://github.com/provablyfine/pf/issues"

[project.scripts]
pf = "provablyfine.cli.pf.main:pf"
pfa = "provablyfine.cli.pfa.main:pfa"
pfat = "provablyfine.tui.app:pfat"
pf-api-rotate = "provablyfine.api.rotate:main"

[tool.coverage.run]
source = [
    "./src/provablyfine",
    "/usr/local/lib/python3.14/site-packages/provablyfine",
]
parallel = true
patch = ["subprocess", "_exit", "execv"]
# uvicorn re-raises SIGTERM on itself after a graceful shutdown, so the server
# subprocess dies from the signal and atexit (hence coverage's auto-save) never
# runs. This makes coverage save its data from its own SIGTERM handler instead.
sigterm = true

[dependency-groups]
dev = [
    "bcrypt",
    "coverage>=7.13.4",
    "hatchling",
    "jinja2>=3.1.6",
    "pyright>=1.1.411",
    "pytest>=9.0.2",
    "pytest-xdist>=3.8.0",
    "pytest-anyio",
    "ruff>=0.15.6",
    "pytest-env>=1.6.0",
    "pytest-timeout>=2.4.0",
    "filelock>=3.29.0",
    "psutil>=7.2.2",
    "zensical>=0.0.50",
    "pre-commit>=4.6.0",
    "cram>=0.7",
    "tox>=4.54.0",
    "tox-uv>=1.35.2",
    "licensecheck>=2025.1.0",
    "mike",
    "codespell>=2.4.2",
    "towncrier>=24.0.0",
    "mutmut>=3.7.0",
    "pyte>=0.8.2",
]
windows-build = [
    "pyinstaller>=6.11.0",
]

[tool.tox]
legacy_tox_ini = """
[tox]
env_list = py312, py313, py314
[testenv]
runner = uv-venv-lock-runner
commands = pytest {posargs}
"""

[tool.mutmut]
source_paths = [
  "src/provablyfine/api/signature.py",
  "src/provablyfine/api/grant.py",
  "src/provablyfine/jwk.py",
  "src/provablyfine/ssh/cert.py",
  "src/provablyfine/ssh/serde.py",
  "src/provablyfine/ssh/buffer.py",
]
pytest_add_cli_args_test_selection = [
  "src/provablyfine/api/",
  "src/provablyfine/test_jwk.py",
  "src/provablyfine/ssh/test_ssh_keygen.py",
  "src/provablyfine/ssh/test_serde.py",
  "src/provablyfine/ssh/test_buffer.py",
]
also_copy = [ "src/provablyfine/" ]
# Error message text/status codes on these lines aren't asserted on by callers;
# excluded so mutation noise doesn't drown out logic-relevant survivors.
do_not_mutate_patterns = [
  "responses\\.(problem_response|ProblemHTTPException)\\(",
  # typing.cast()'s type argument is erased at runtime (cast is a no-op that
  # returns its value unchanged), so mutating it can never affect a test.
  "typing\\.cast\\(",
  # Log message text isn't asserted on by any test.
  "logger\\.(debug|info|warning|error)\\(",
  # assert message text for can_update()'s field-name check; the field list
  # itself (on a separate line from the message in every case) is asserted
  # per-field by the corresponding test_filter_*/test_empty_* tests.
  "\"You tried to update a field that does not exist\"",
  # Bare "assert False" exhaustiveness-guard bodies (else:/case _: fallbacks)
  # in jwk.py — unreachable by any legitimately constructed value, so no test
  # can (or should) hit them. (jwk.py's dispatch methods use if/elif/else
  # rather than match/case specifically so this pattern — and the per-branch
  # "# pragma: no mutate" comments elsewhere in jwk.py — can actually take
  # effect: mutmut has no pragma support for MatchCase nodes at all.)
  "^\\s*assert False$",
  # codecs.lookup() is case-insensitive for codec names (verified:
  # codecs.lookup('utf-8') is codecs.lookup('UTF-8'), same for 'ascii'), so a
  # case-mutated literal argument to .encode()/.decode() can never be
  # observed. Scoped to the two codec names actually used in the codebase
  # (utf-8, ascii) rather than any codec name: an argument-dropped mutation
  # (e.g. .encode("latin-1") -> .encode(), which defaults to utf-8) would NOT
  # be equivalent for a codec other than utf-8/ascii on non-ASCII-safe data,
  # so widening this to an arbitrary codec name would silently swallow real
  # mutants on any future call site using a different one.
  "\\.(encode|decode)\\(\"(utf-8|ascii)\"\\)",
  # cert.py's exceptions.Error(...) message text isn't asserted on by any test.
  "exceptions\\.Error\\(",
  # jwk.py's BcryptRequiredError(...) message text isn't asserted on by any test
  # (only the exception type and a truncated "bcrypt" match= substring are).
  "BcryptRequiredError\\(",
]

[tool.codespell]
skip = "*.min.js,*.min.css"
count = true
quiet-level = 3
ignore-words-list = "iTerm"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--tb=short -n auto"
testpaths = [
    "src/provablyfine",
    "tests",
]
timeout = 240

[tool.pytest_env]
HTTP_PROXY = { unset = true }
HTTPS_PROXY = { unset = true }
PYTHONASYNCIODEBUG = "1"
PYTHONUNBUFFERED = "1"
PF_LOG_LEVEL = "3"
PF_TIMEOUT = "30"

[tool.pyright]
include = ["src/provablyfine", "tests", "packages/provablyfine-client/src/provablyfine_client"]
exclude = [
"**/node_modules",
"**/__pycache__",
"tests/**",
"**/test_*.py",
]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 120
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF", "S"]
[tool.ruff.lint.per-file-ignores]
"build/**" = []
"**" = ["S101", "S110", "S606"]
"tests/**" = ["S"]
#"**/conftest.py" = ["S101"]

[tool.mypy]
strict = true

[tool.towncrier]
package = "pf"
package_dir = "src"
filename = "CHANGELOG.md"
directory = "changelog.d"
title_format = "## {version} - {project_date}"
issue_format = "[#{issue}](https://github.com/provablyfine/pf/issues/{issue})"

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory = "change"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = false

[tool.uv.workspace]
members = ["packages/provablyfine-client"]

[tool.uv.sources]
mike = { git = "https://github.com/squidfunk/mike.git" }
provablyfine-client = { workspace = true }
